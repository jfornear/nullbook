services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - sqlite-data:/app/db-data
      - media-data:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=nullbook.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_categories &&
             python manage.py create_local_user &&
             python manage.py runserver 0.0.0.0:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8001

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - sqlite-data:/app/db-data
      - media-data:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=nullbook.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend
    command: celery -A nullbook worker -l info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - sqlite-data:/app/db-data
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=nullbook.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend
    command: celery -A nullbook beat -l info

volumes:
  sqlite-data:
  media-data:

# IMPORTANT: For production use, set DATABASE_URL in .env to a PostgreSQL database.
# SQLite does not support concurrent writes from multiple processes (backend + celery).
# Example: DATABASE_URL=postgres://nullbook:password@db:5432/nullbook

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - sqlite-data:/app/db-data
      - media-data:/app/media
      - logs-data:/app/logs
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=nullbook.settings
      - DJANGO_DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: >
      sh -c "python manage.py migrate --run-syncdb &&
             python manage.py seed_categories &&
             python manage.py seed_email_rules &&
             python manage.py create_local_user --username \"$${NULLBOOK_ADMIN_USER:-admin}\" --password \"$${NULLBOOK_ADMIN_PASSWORD:?Set NULLBOOK_ADMIN_PASSWORD in .env}\" &&
             gunicorn nullbook.wsgi:application --bind 0.0.0.0:8001 --workers 3 --timeout 120"
    # Note: Only the backend service runs migrations. Celery/beat depend_on backend
    # to ensure migrations finish before workers start.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 128M

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - sqlite-data:/app/db-data
      - media-data:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=nullbook.settings
      - DJANGO_DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    command: celery -A nullbook worker -l info --concurrency=2
    deploy:
      resources:
        limits:
          memory: 256M

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - sqlite-data:/app/db-data
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=nullbook.settings
      - DJANGO_DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    command: celery -A nullbook beat -l info
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  sqlite-data:
  media-data:
  redis-data:
  logs-data:

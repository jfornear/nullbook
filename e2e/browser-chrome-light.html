<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 1580px;
        height: 994px;
        background: hsl(0, 0%, 96%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .window {
        width: 1442px;
        border: 1px solid hsl(0, 0%, 86%);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 8px 32px hsla(0, 0%, 0%, 0.1);
      }

      .title-bar {
        height: 44px;
        flex-shrink: 0;
        background: hsl(0, 0%, 96%);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 8px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: hsl(0, 0%, 86%);
      }

      .content img {
        display: block;
        width: 1440px;
        height: 810px;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="title-bar">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="content">
        <img src="" />
      </div>
    </div>
  </body>
</html>
